name: keepalive
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (keeps the Supabase free project awake)
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
        run: curl -fsS --retry 3 --retry-all-errors --retry-delay 10 --max-time 30 "$APP_BASE_URL/api/health"
